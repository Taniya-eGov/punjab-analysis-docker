# Punjab Analysis System v3.0 - Airflow Docker Compose
# Improved networking and configuration management

version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.10.0-python3.11
  group_add:
    - "1001"
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__WEBSERVER__RBAC: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'punjab-analysis-secret-key-v3'

    # Kubernetes configuration
    AIRFLOW__KUBERNETES__NAMESPACE: default
    AIRFLOW__KUBERNETES__WORKER_CONTAINER_REPOSITORY: punjab-analysis
    AIRFLOW__KUBERNETES__WORKER_CONTAINER_TAG: v3.0.0
    AIRFLOW__KUBERNETES__DELETE_WORKER_PODS: 'true'
    AIRFLOW__KUBERNETES__DAGS_IN_IMAGE: 'false'

    # Enhanced logging
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30

    # Performance tuning
    AIRFLOW__CORE__PARALLELISM: 32
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 16
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 4

  volumes:
    - ${PWD}/airflow/dags:/opt/airflow/dags
    - ${PWD}/airflow/logs:/opt/airflow/logs
    - ${PWD}/airflow/plugins:/opt/airflow/plugins
    - ${PWD}/airflow/airflow_variables.json:/opt/airflow/airflow_variables.json
    - /var/run/docker.sock:/var/run/docker.sock:rw
    - /tmp/kube-config/config:/home/airflow/.kube/config:ro
    - ~/.minikube:/home/admin1/.minikube:ro

  user: "${AIRFLOW_UID:-50000}:0"

  extra_hosts:
    - "minikube:192.168.49.2"
    - "host.minikube.internal:192.168.49.1"
    - "host.docker.internal:host-gateway"

  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # PostgreSQL Database for Airflow
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_db_volume:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    environment:
      <<: *airflow-common-env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow Initialization
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin123}
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//./ }
        }
        airflow_version=$$(AIRFLOW__LOGGING__LOGGING_LEVEL=INFO && airflow version)
        airflow_version_comparable=$$(ver $${airflow_version})
        min_airflow_version=2.2.0
        min_airflow_version_comparable=$$(ver $${min_airflow_version})

        if (( airflow_version_comparable < min_airflow_version_comparable )); then
          echo "❌ ERROR: Too old Airflow version $${airflow_version}!"
          echo "The minimum Airflow version supported: $${min_airflow_version}"
          exit 1
        fi

        echo "🚀 Initializing Punjab Analysis System v3.0 with Airflow $${airflow_version}"

        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo "⚠️  WARNING: AIRFLOW_UID not set!"
          echo "Files will be owned by root. Set AIRFLOW_UID environment variable."
        fi

        # System requirements check
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')

        echo "💻 System Resources:"
        echo "   Memory: $$(numfmt --to iec $$((mem_available * one_meg)))"
        echo "   CPUs: $${cpus_available}"
        echo "   Disk: $$(numfmt --to iec $$((disk_available * 1024)))"

        if (( mem_available < 4000 )); then
          echo "⚠️  WARNING: Less than 4GB memory available"
        fi

        if (( cpus_available < 2 )); then
          echo "⚠️  WARNING: Less than 2 CPUs available"
        fi

        # Initialize Airflow
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version

    user: "0:0"
    volumes:
      - ${PWD}/airflow:/sources

  # Airflow CLI (for debugging)
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  postgres_db_volume: