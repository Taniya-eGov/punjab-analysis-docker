          subPath: pod_template.yaml
      volumes:
      - name: dags-volume
        emptyDir: {}
      - name: dag-configmap
        configMap:
          name: punjab-kubernetes-dag
      - name: logs-volume
        persistentVolumeClaim:
          claimName: airflow-logs-pvc
      - name: pod-template
        configMap:
          name: pod-template-config
---