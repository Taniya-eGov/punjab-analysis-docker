apiVersion: v1
kind: PersistentVolume
metadata:
  name: punjab-data-pv
  labels:
    type: hostpath
    app: punjab-analysis
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  hostPath:
    path: /tmp/punjab-analysis/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: punjab-output-pv
  labels:
    type: hostpath
    app: punjab-analysis
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  hostPath:
    path: /tmp/punjab-analysis/output
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: punjab-secrets-pv
  labels:
    type: hostpath
    app: punjab-analysis
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  storageClassName: standard
  hostPath:
    path: /tmp/punjab-analysis/secrets
    type: DirectoryOrCreate
---