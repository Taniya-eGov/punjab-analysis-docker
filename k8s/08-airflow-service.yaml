apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: punjab-analysis
  labels:
    app: airflow
    component: webserver
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30082
    protocol: TCP
  selector:
    app: airflow
    component: webserver
---