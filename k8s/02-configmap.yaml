apiVersion: v1
kind: ConfigMap
metadata:
  name: punjab-analysis-config
  namespace: punjab-analysis
data:
  # Application Configuration
  CHUNK_SIZE: "50000"
  CREATEDTIME_LIMIT: "1757269799000"
  ENVIRONMENT: "production"

  # Tenant Configuration
  DEFAULT_TENANT_IDS: "pb.adampur,pb.samana,pb.amloh"

  # Directory Configuration
  DATA_DIR: "/data"
  OUTPUT_DIR: "/output"
  CONFIG_PATH: "/run/secrets/db_config.yaml"

  # Cleanup Configuration
  MAX_AGE_HOURS: "24"
  DRY_RUN: "false"
---